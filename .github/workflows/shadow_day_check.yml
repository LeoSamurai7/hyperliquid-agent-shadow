name: SHADOW-DAY Readonly Check
on:
  push:
    branches: [ main ]
jobs:
  shadow-day:
    if: github.event.head_commit.message == 'RUN SHADOW-DAY READONLY CHECK'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live Railway endpoints only
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://hyperliquid-agent-shadow-production.up.railway.app"
          echo "=== HEALTH ==="
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body "$BASE/health"
          echo
          echo "=== STATE ==="
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body "$BASE/state"
          echo
          echo "=== EXECUTION_STATE ==="
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body "$BASE/execution/state"
          echo
          echo "=== EVENTS ==="
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body "$BASE/events?limit=40"
          echo

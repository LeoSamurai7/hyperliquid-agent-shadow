name: SHADOW-DAY Readonly Check
on:
  push:
    branches: [main]
jobs:
  check:
    if: github.event.head_commit.message == 'RUN SHADOW-DAY READONLY CHECK'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live endpoints
        shell: bash
        run: |
          set -euo pipefail
          B="https://hyperliquid-agent-shadow-production.up.railway.app"
          echo "=== HEALTH ==="
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body "$B/health"
          echo
          echo "=== EXECUTION_STATE ==="
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body "$B/execution/state"
          echo
          echo "=== EVENTS ==="
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body "$B/events?limit=80"
          echo
          echo "=== DECISIONS ==="
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body "$B/decisions?limit=20"
          echo

name: V1.7 research-only unit tests
on:
  pull_request:
    paths:
      - 'agent/short_*research.py'
      - 'tests/test_short_*research.py'
      - 'tests/test_sweep_replay_research.py'
      - 'scripts/research_sweep_replay.py'
      - 'scripts/research_sweep_live_data.py'
      - '.github/workflows/v17-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research-only unit tests (no exchange credentials)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_short_*research.py' -v
          python -m unittest discover -s tests -p 'test_sweep_replay_research.py' -v
  historical-btc-sweep-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public BTC candles and backtest offline
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m scripts.research_sweep_live_data
      - name: Upload research backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-btc-sweep-research-report
          path: v17_sweep_backtest.json
          if-no-files-found: warn

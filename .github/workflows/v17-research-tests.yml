name: V1.7 research-only unit tests
on:
  pull_request:
    paths:
      - 'agent/short_*research.py'
      - 'tests/test_short_*research.py'
      - '.github/workflows/v17-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research-only unit tests (no exchange credentials)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_short_*research.py' -v

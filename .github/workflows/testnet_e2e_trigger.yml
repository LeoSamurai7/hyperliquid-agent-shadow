name: One-shot Testnet E2E Trigger

on:
  push:
    branches: [ main ]

jobs:
  run-testnet-trigger:
    if: github.event.head_commit.message == 'RUN ONE-SHOT TESTNET E2E TRIGGER'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke guarded Testnet trigger
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://hyperliquid-agent-shadow-production.up.railway.app"
          echo "Calling guarded TESTNET-only one-shot trigger..."
          curl --retry 4 --retry-delay 5 --retry-all-errors --fail-with-body             -X POST "$BASE/execution/test-trigger?confirm=TESTNET_ONLY_144"             -o trigger.json
          cat trigger.json
          python - <<'PY'
          import json
          d=json.load(open("trigger.json"))
          print("\nTRIGGER_STATUS=",d.get("status"))
          print("TRIGGER_OK=",d.get("ok"))
          if d.get("ok") is not True:
              raise SystemExit(2)
          PY
      - name: Read final one-shot status
        if: always()
        shell: bash
        run: |
          BASE="https://hyperliquid-agent-shadow-production.up.railway.app"
          echo "Final trigger state:"
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body             "$BASE/execution/test-trigger/status"
          echo
          echo "Execution state:"
          curl --retry 4 --retry-delay 3 --retry-all-errors --fail-with-body             "$BASE/execution/state"
          echo
